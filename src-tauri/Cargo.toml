[package]
name = "app"
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2" }
tauri-plugin-log = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "default-tls"] }
cpal = "0.15"
tokio = { version = "1", default-features = false, features = ["sync"] }
# Conversation ZIP export (transcript + audio clips). Stored uncompressed-ok;
# default deflate. No external system deps.
zip = { version = "2", default-features = false, features = ["deflate"] }
# OS-native secret storage for the API key (Windows Credential Manager).
# Add `apple-native` / `sync-secret-service` features for macOS / Linux builds.
keyring = { version = "3", features = ["windows-native"] }
# ONNX Runtime for on-device speaker-embedding diarization (docs/PROJECT.md §10.6).
# `download-binaries` fetches the prebuilt onnxruntime native lib at build time.
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["download-binaries", "ndarray"] }
# Pin ort-sys to match: rc.10+ build scripts add a mandatory TLS feature that
# ort rc.9 doesn't forward, breaking `download-binaries`.
ort-sys = { version = "=2.0.0-rc.9" }
